name: Temporary Jazzpolizei image staging 2026-09-01

on:
  push:
    branches:
      - jp-image-stage-20260901
    paths:
      - 'tmp/jp44/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jp-image-stage-20260901
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jp-image-stage-20260901
      - name: Reconstruct temporary image
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/jp44/chunk-*.b64 | tr -d '\n\r ' | base64 --decode > tmp/jazzpolizei-einsatzskizzen-44-lagezentrum.webp
          test "$(stat -c%s tmp/jazzpolizei-einsatzskizzen-44-lagezentrum.webp)" -eq 40226
          echo '7333f5cab2957600e7ed9c3028fdc639dd196c01ad8baaac5856c9ce8e867266  tmp/jazzpolizei-einsatzskizzen-44-lagezentrum.webp' | sha256sum --check
          file tmp/jazzpolizei-einsatzskizzen-44-lagezentrum.webp | grep -qi webp
      - name: Commit temporary public staging asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'temporary-image-stager[bot]'
          git config user.email 'temporary-image-stager@users.noreply.github.com'
          git add tmp/jazzpolizei-einsatzskizzen-44-lagezentrum.webp
          if git diff --cached --quiet; then
            echo 'Image already reconstructed.'
            exit 0
          fi
          git commit -m 'Temporary Jazzpolizei Einsatzskizzen 44 image staging'
          git push origin HEAD:jp-image-stage-20260901
